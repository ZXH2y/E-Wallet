<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title>A-Wallets</title>
  </head>
  <body class="bg-blue-50 antialiased mx-3">
    <div class="mx-auto min-h-screen max-w-[768px] bg-blue-50">
      <!-- App Bar -->
      <header
        class="sticky top-0 z-20 border-b border-blue-100/70 bg-white/80 backdrop-blur-md"
      >
        <div class="flex h-16 items-center justify-between px-3">
          <!-- Back -->
          <a
            href="#"
            aria-label="Kembali"
            class="group flex size-10 items-center justify-center rounded-2xl bg-blue-50 text-blue-600 ring-1 ring-blue-100 transition-all duration-200 hover:bg-blue-600 hover:text-white hover:shadow-md hover:shadow-blue-600/30 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
          >
            <span
              class="icon-[material-symbols--arrow-back-rounded] size-6 transition-transform duration-200 group-hover:-translate-x-0.5"
              aria-hidden="true"
            ></span>
          </a>

          <!-- Title -->
          <div class="min-w-0 flex-1 px-3 text-center">
            <h1
              class="truncate text-base font-bold tracking-tight text-gray-900"
            >
              Untitled
            </h1>
            <p class="truncate text-xs font-medium text-gray-400">A-Wallets</p>
          </div>

          <!-- Action -->
          <button
            type="button"
            aria-label="Menu lainnya"
            class="flex size-10 items-center justify-center rounded-2xl text-gray-500 transition-all duration-200 hover:bg-gray-100 hover:text-gray-900 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
          >
            <span
              class="icon-[material-symbols--more-vert] size-6"
              aria-hidden="true"
            ></span>
          </button>
        </div>
      </header>
      <!-- ./App Bar -->
      <!-- nav bar -->
      <div class="m-5 p-2 flex bg-white justify-evenly">
        <a
          href="#"
          class="w-full group flex flex-col items-center focus:outline-none focus:ring-2 focus:ring-green-400 p-3 text-gray-900 hover:bg-gray-50"
        >
          <span
            class="icon-[material-symbols--home-outline-rounded] size-6 inline group-hover:hidden"
          ></span>
          <span
            class="icon-[material-symbols--home] size-6 hidden group-hover:inline"
          ></span>
          <span class="text-xs font-semibold">Beranda</span>
          <span></span>
        </a>
        <a
          href="#"
          class="w-full group flex flex-col items-center focus:outline-none focus:ring-2 focus:ring-green-400 p-3 text-gray-900 hover:bg-gray-50"
        >
          <span
            class="icon-[material-symbols--receipt-outline-rounded] size-6 inline group-hover:hidden"
          ></span>
          <span
            class="icon-[material-symbols--receipt] size-6 hidden group-hover:inline"
          ></span>
          <span class="text-xs font-semibold">Riwayat</span>
          <span></span>
        </a>
        <a
          href="#"
          class="w-full group flex flex-col items-center focus:outline-none focus:ring-2 focus:ring-green-400 p-3 text-gray-900 hover:bg-gray-50"
        >
          <span
            class="icon-[material-symbols--person-outline-rounded] size-6 inline group-hover:hidden"
          ></span>
          <span
            class="icon-[material-symbols--person] size-6 hidden group-hover:inline"
          ></span>
          <span class="text-xs font-semibold">Akun</span>
          <span></span>
        </a>
      </div>
      <!-- ./nav bar -->

      <!-- button  -->
      <div>
        <h1 class="text-2xl text-center text-gray-900">Button Primary</h1>
        <!-- button primary Large -->
        <button
          type="button"
          class="inline-flex items-center font-semibold bg-green-600 text-white uppercase gap-2 text-sm p-2.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-green-400 hover:bg-green-800 disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400"
        >
          <span class="icon-[material-symbols--download-rounded] size-6"></span>
          <span>My Button </span>
          <span class="icon-[material-symbols--download-rounded] size-6"></span>
        </button>
        <!-- ./ button primary Large -->

        <!-- button primary Small -->
        <button
          type="button"
          class="inline-flex items-center font-semibold bg-green-600 text-white uppercase gap-2 text-xs p-2 rounded-2xl focus:outline-none focus:ring-2 focus:ring-green-400 hover:bg-green-800 disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400"
        >
          <span class="icon-[material-symbols--download-rounded] size-4"></span>
          <span>My Button </span>
          <span class="icon-[material-symbols--download-rounded] size-4"></span>
        </button>
        <!-- ./ button primary Small -->
      </div>
      <!-- ./ button  -->

      <!-- button  -->
      <div>
        <h1 class="text-2xl text-center text-gray-900">Button Outline</h1>
        <!-- button Outline Large -->
        <button
          type="button"
          class="inline-flex items-center font-semibold bg-transparent text-green-500 uppercase gap-2 text-sm p-2.5 border-2 border-green-300 rounded-2xl focus:outline-none hover:text-white focus:ring-2 focus:ring-green-400 hover:bg-green-800 disabled:cursor-not-allowed disabled:text-gray-400 disabled:border-gray-300 disabled:bg-transparent"
        >
          <span class="icon-[material-symbols--download-rounded] size-6"></span>
          <span>My Button </span>
          <span class="icon-[material-symbols--download-rounded] size-6"></span>
        </button>
        <!-- ./ button Outline Large -->

        <!-- button Outline Small -->
        <button
          type="button"
          class="inline-flex items-center font-semibold bg-transparent text-green-500 uppercase gap-2 text-xs p-2 border-2 border-green-300 rounded-2xl focus:outline-none hover:text-white focus:ring-2 focus:ring-green-400 hover:bg-green-800 disabled:cursor-not-allowed disabled:text-gray-400 disabled:border-gray-300 disabled:bg-transparent"
        >
          <span class="icon-[material-symbols--download-rounded] size-4"></span>
          <span>My Button </span>
          <span class="icon-[material-symbols--download-rounded] size-4"></span>
        </button>
        <!-- ./ button Outline Small -->
      </div>
      <!-- ./ button  -->

      <!-- button  -->
      <div>
        <h1 class="text-2xl text-center text-gray-900">Button Secondary</h1>
        <!-- button Secondary Large -->
        <button
          type="button"
          class="inline-flex items-center font-semibold bg-white text-green-500 uppercase gap-2 text-sm p-2.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-green-400 hover:bg-emerald-50 disabled:cursor-not-allowed disabled:text-gray-400 disabled:border-gray-300 disabled:bg-transparent"
          disabled
        >
          <span class="icon-[material-symbols--download-rounded] size-6"></span>
          <span>My Button </span>
          <span class="icon-[material-symbols--download-rounded] size-6"></span>
        </button>
        <!-- ./ button Secondary Large -->

        <!-- button Secondary Small -->
        <button
          type="button"
          class="inline-flex items-center font-semibold bg-white text-green-500 uppercase gap-2 text-xs p-2 rounded-2xl focus:outline-none focus:ring-2 focus:ring-green-400 hover:bg-emerald-50 disabled:cursor-not-allowed disabled:text-gray-400 disabled:border-gray-300 disabled:bg-transparent"
        >
          <span class="icon-[material-symbols--download-rounded] size-4"></span>
          <span>My Button </span>
          <span class="icon-[material-symbols--download-rounded] size-4"></span>
        </button>
        <!-- ./ button =Secondary Small -->
      </div>
      <!-- ./ button  -->
    </div>

    <div class="h-8"></div>

    <!-- input -->
    <div class="text-center text-2xl text-gray-900">Input Text</div>

    <div class="">
      <label
        for="my-input-text"
        class="text-sm font-medium uppercase text-gray-900 ps-4"
        >Input Lable</label
      >
      <div class="relative h-10">
        <input
          type="email"
          name=""
          id="my-input-text"
          class="w-full rounded-2xl border-gray-400 bg-white p-3 pe-12 ps-12 text-sm text-gray-900 placeholder:text-gray-400 focus:ring-4 focus:ring-green-600 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:invalid:ring-red-900 disabled:border-gray-300 disabled:bg-gray-100"
          placeholder="Input placeholder"
        />
        <div
          class="absolute start-0 inset-y-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400"
        >
          <span
            class="icon-[material-symbols--arrow-left-alt-rounded] size-4"
          ></span>
        </div>
        <div
          class="absolute end-0 inset-y-0 flex items-center pe-4 text-gray-400"
        >
          <span
            class="icon-[material-symbols--arrow-right-alt-rounded] size-4"
          ></span>
        </div>
        <p class="ps-4 text-xs text-gray-900">This is for hint</p>
      </div>
    </div>
    <!-- ./ input -->
  </body>
</html>
